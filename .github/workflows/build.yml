name: Build DualSpeaker.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tests (simulated devices)
        run: python tests/test_dual_speaker.py

      - name: Build exe
        run: pyinstaller --noconfirm --onefile --windowed --name DualSpeaker dual_speaker.py

      - name: Smoke test (exe starts, serves the UI, quits cleanly)
        shell: pwsh
        run: |
          $p = Start-Process dist\DualSpeaker.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $r = Invoke-WebRequest http://127.0.0.1:8765/state -UseBasicParsing; $ok = $true } catch {}
          }
          if (-not $ok) { throw "exe did not start its UI server" }
          Write-Host $r.Content
          Invoke-WebRequest http://127.0.0.1:8765/cmd -Method POST -Body '{"cmd":"quit"}' -ContentType 'application/json' -UseBasicParsing | Out-Null
          if (-not $p.WaitForExit(10000)) { Stop-Process $p -Force; throw "exe did not quit" }
          Write-Host "exe started and quit OK"

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path dual_speaker.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v5
        with:
          name: DualSpeaker
          path: dist/DualSpeaker.exe

      # Every push to main publishes (or refreshes) the release for the version in
      # dual_speaker.py. Bump __version__ to make a new release.
      - name: Publish release with the exe
        if: github.ref == 'refs/heads/main' || github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('v{0}', steps.ver.outputs.version) }}
          name: Dual Speaker v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: dist/DualSpeaker.exe
